<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>curso</title>
</head>
<body>

<header class="iniciar">
    <h1>Curso de logica de programação</h1>
    
        <button onclick="iniciar()">Start</button>
    
</header>

<audio id="musica" loop>
    <source src="./audio/projeto1.mp3" type="audio/mpeg">
</audio>



<script>
    function tocarMusica() {
        const audio = document.getElementById('musica');
        audio.volume = 0.5
        audio.play();

        setTimeout(() => {
        window.location.href = "./html/pagina.html"; 
        }, 300);
    }

    function iniciar() {
  const audio = document.getElementById("musica");
  
  audio.volume = 0.5;

  audio.play().then(() => {
    // Só troca de página DEPOIS que começar a tocar
    setTimeout(() => {
      window.location.href = "./html/pagina.html";
    }, 1500);
  }).catch((erro) => {
    alert("Clique novamente para iniciar o som");
    console.log(erro);
  });
}

        

</script>
</body>
</html>
